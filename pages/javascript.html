<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor, Menor y Ordenar 3 Números</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100px;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e7f3ff;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Análisis de 3 Números</h1>
        <p>Introduce tres números:</p>
        <input type="number" id="num1" placeholder="Número 1" step="any">
        <input type="number" id="num2" placeholder="Número 2" step="any">
        <input type="number" id="num3" placeholder="Número 3" step="any">
        <br>
        <button onclick="analizarNumeros()">Analizar</button>
        <button onclick="limpiar()">Limpiar</button>
        <div id="result"></div>
    </div>

    <script>
        function analizarNumeros() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const num3 = parseFloat(document.getElementById('num3').value);

            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                document.getElementById('result').innerHTML = 'Por favor, introduce tres números válidos.';
                return;
            }

            const numeros = [num1, num2, num3];
            const mayor = Math.max(...numeros);
            const menor = Math.min(...numeros);
            const ordenados = numeros.slice().sort((a, b) => a - b);

            document.getElementById('result').innerHTML = `
                <p>Mayor: ${mayor}</p>
                <p>Menor: ${menor}</p>
                <p>Ordenados: ${ordenados.join(', ')}</p>
            `;
        }

        function limpiar() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('num3').value = '';
            document.getElementById('result').innerHTML = '';
        }
    </script>
</body>
</html>
