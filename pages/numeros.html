<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Nuevo Ejercicio: Mayor, Menor y Ordenar 3 Números</h2>
<p>Introduce tres números:</p>
<input type="number" id="num1" placeholder="Número 1" step="any" style="width:100px; padding:5px; margin:5px;">
<input type="number" id="num2" placeholder="Número 2" step="any" style="width:100px; padding:5px; margin:5px;">
<input type="number" id="num3" placeholder="Número 3" step="any" style="width:100px; padding:5px; margin:5px;">
<br>
<button onclick="analizarNumeros()" style="background:#4CAF50; color:white; padding:10px 20px; margin:5px; border:none; cursor:pointer;">Analizar</button>
<button onclick="limpiar()" style="background:#f44336; color:white; padding:10px 20px; margin:5px; border:none; cursor:pointer;">Limpiar</button>
<div id="result" style="margin-top:20px; padding:15px; background:#e7f3ff; border-radius:5px; font-weight:bold;"></div>

<script>
function analizarNumeros() {
    const num1 = parseFloat(document.getElementById('num1').value);
    const num2 = parseFloat(document.getElementById('num2').value);
    const num3 = parseFloat(document.getElementById('num3').value);

    if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
        document.getElementById('result').innerHTML = 'Introduce tres números válidos.';
        return;
    }

    const numeros = [num1, num2, num3];
    const mayor = Math.max(...numeros);
    const menor = Math.min(...numeros);
    const ordenados = numeros.slice().sort((a, b) => a - b);

    document.getElementById('result').innerHTML = `
        Mayor: ${mayor}<br>
        Menor: ${menor}<br>
        Ordenados: ${ordenados.join(', ')}
    `;
}

function limpiar() {
    document.getElementById('num1').value = '';
    document.getElementById('num2').value = '';
    document.getElementById('num3').value = '';
    document.getElementById('result').innerHTML = '';
}
</script>
    
</body>
</html>
