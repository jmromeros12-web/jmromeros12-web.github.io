<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iconos PNG, SVG y Font Awesome</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <h2>Icono PNG</h2>
  <img src="icono-home.png" alt="Icono de casa" width="32" height="32" />

  <h2>Icono SVG externo</h2>
  <img src="icono-home.svg" alt="Icono de casa" width="32" height="32" />

  <h2>Icono SVG inline</h2>
  <svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 12 L12 32 H24 V52 H40 V32 H52 Z" fill="black" />
  </svg>

  <h2>Icono Font Awesome</h2>
  <i class="fas fa-home" style="font-size:32px;"></i>

</body>
</html>
